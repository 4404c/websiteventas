<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda - Catálogo</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
  <div class="logo" onclick="mostrarCatalogo()">CEIBO<span>.</span></div>
  <nav>
    <a href="#" onclick="mostrarCatalogo(); return false;">Catálogo</a>
    <a href="https://wa.me/5490000000000" target="_blank">Contacto</a>
  </nav>
</header>

<div class="container">

  <!-- ===== VISTA 1: CATALOGO ===== -->
  <div id="vista-catalogo">
    <h2 class="grilla-titulo">Catálogo</h2>
    <div class="filtros" id="filtros"></div>
    <div class="grilla" id="grilla-productos"></div>
  </div>

  <!-- ===== VISTA 2: DETALLE DE PRODUCTO ===== -->
  <div id="vista-detalle" class="oculto">
    <button class="volver" onclick="mostrarCatalogo()">&larr; volver al catálogo</button>
    <div class="producto">
      <div class="foto-columna">
        <div class="foto">
          <img id="detalle-foto" src="" alt="">
          <button class="foto-flecha foto-flecha-izq" onclick="fotoAnterior()">&#10094;</button>
          <button class="foto-flecha foto-flecha-der" onclick="fotoSiguiente()">&#10095;</button>
        </div>
        <div class="foto-puntos" id="foto-puntos"></div>
      </div>
      <div class="info">
        <div class="etiquetas-detalle" id="detalle-etiquetas"></div>
        <h1 id="detalle-titulo"></h1>
        <span class="badge-stock oculto" id="detalle-stock"></span>
        <div class="precio" id="detalle-precio"></div>
        <p class="desc" id="detalle-desc"></p>
        <ul class="specs" id="detalle-specs"></ul>
        <div class="cta">
          <a class="btn-principal" id="detalle-whatsapp" target="_blank">Consultar por WhatsApp</a>
        </div>
      </div>
    </div>
  </div>

</div>

<footer>Retiro en punto físico &middot; Envíos a coordinar</footer>

<!-- El orden importa: productos.js primero, app.js después -->
<script src="productos.js"></script>
<script src="app.js"></script>
</body>
</html>
